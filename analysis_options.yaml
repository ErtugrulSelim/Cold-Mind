include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by build_runner; regenerate rather than edit.
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    # Verbatim v1 question lists, kept only as the migration's input. They are
    # not project code and are deleted once every season has been migrated.
    - "tool/legacy/**"
  errors:
    # An unused import or dead field is a leftover, and leftovers are what the
    # rewrite exists to get rid of.
    unused_import: error
    unused_local_variable: error
    unused_field: error

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_single_quotes
    - unawaited_futures
