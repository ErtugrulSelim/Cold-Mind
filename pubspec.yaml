name: coldmind
description: "Cold Mind - detective investigation game"
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management. Every service in the v1 codebase was a hand-rolled
  # singleton; these replace them with providers that can be overridden in
  # tests and disposed with the case they belong to.
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Immutable models + JSON parsing, both generated. The v2 case schema is
  # large enough that hand-written fromJson is where the bugs would live.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Navigation.
  go_router: ^17.5.0

  # Progress + session persistence (solved counts, logins, lock steps).
  shared_preferences: ^2.5.5

  # Maps app surface.
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # Voice notes, voice memos, question-screen audio clues.
  audioplayers: ^6.8.1

  # Instagram-style video posts in the explore/feed surfaces.
  video_player: ^2.14.0

  collection: ^1.19.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  purchases_flutter: ^10.11.0
  intl: ^0.20.3
  firebase_core: ^4.14.0
  firebase_remote_config: ^6.6.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  # Declared for `tools/gen_icon.dart`, which reads the logo and writes the
  # two launcher sources below. It arrives as one of flutter_launcher_icons'
  # own dependencies either way; naming it here is what keeps the tool
  # compiling if that ever stops being true.
  image: ^4.5.4

# The launcher icon, generated into the native project rather than shipped as
# a Flutter asset — nothing in Dart can reach it. Regenerate with
# `dart run flutter_launcher_icons` after changing either image.
#
# Two source images, because Android draws the icon two ways and the two want
# different framings. Both are written by `tools/gen_icon.dart` from
# `assets/icons/app_logo.png` — run that first, then this.
#
# `image_path` is the legacy square: a centre crop, because the logo carries
# margin of its own and a legacy icon is only lightly rounded.
#
# The adaptive foreground is what Android 8 and later actually use, and it is
# the whole logo scaled down instead — an adaptive icon is 108dp with only the
# middle 72dp guaranteed, so a round mask cuts away everything outside a circle
# of that diameter. **The generator insets neither image**: it scales what it
# is handed to fill the whole canvas, so the safe-zone margin has to be baked
# into the file. Given the crop, the top of the phone and the base of the
# wordmark are clipped on every launcher that masks to a circle.
#
# The background is the logo's own corner tone rather than the device
# register's graphite, because a rounded-square mask reaches past the
# foreground's artwork at the corners and the two have to meet without a seam.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icons/raw/app_icon.png"
  adaptive_icon_background: "#12151D"
  adaptive_icon_foreground: "assets/icons/raw/app_icon_foreground.png"
  min_sdk_android: 21

# Generates the native splash Android and iOS show before the Flutter engine
# has drawn a single frame — the one place a Dart-level splash widget cannot
# reach. The background is the logo's own corner tone, not the device
# register's graphite (`palette.dart`'s `Color(0xFF0A0C10)`): the splash draws
# the logo centred on a flat colour, and anything but its own ground leaves a
# visible square around it. The two are close enough that the handover to the
# first Flutter frame is not a step anybody sees. Regenerate with
# `dart run flutter_native_splash:create` after changing either.
flutter_native_splash:
  color: "12151D"
  image: assets/icons/app_logo.png
  android_12:
    color: "12151D"
    image: assets/icons/app_logo.png

flutter:
  uses-material-design: true

  assets:
    # The phone's app icons, one PNG per key in `app_registry`. Only the
    # folder itself is listed — `raw/` holds the untouched generator output
    # and is deliberately not shipped.
    - assets/icons/
    # The player's own three controls — cases, questions, board. They sit on
    # the phone but belong to the warm register, which is why they are brass
    # rather than another cold tile, and why they live outside assets/icons/.
    - assets/desk/
    # One case.json per case: the phone, the cast, the lock chain and the
    # questions in one document. index.json lists them for the case deck.
    - assets/cases/
    - assets/cases/s01/
    - assets/cases/s01/photos/
    - assets/cases/s01/endings/
    - assets/cases/s01/audio/
    - assets/cases/s02/
    - assets/cases/s02/photos/
    - assets/cases/s02/endings/
    - assets/cases/s02/audio/
    - assets/cases/s03/
    - assets/cases/s03/photos/
    - assets/cases/s03/endings/
    - assets/cases/s04/
    - assets/cases/s04/photos/
    - assets/cases/s04/endings/
    - assets/cases/s04/audio/
    - assets/cases/s05/
    - assets/cases/s05/photos/
    - assets/cases/s05/endings/
    - assets/cases/s05/audio/
    - assets/cases/s06/
    - assets/cases/s06/photos/
    - assets/cases/s06/endings/
    - assets/cases/s06/audio/
    - assets/cases/s07/
    - assets/cases/s07/photos/
    - assets/cases/s07/endings/
    - assets/cases/s07/audio/
    - assets/cases/s08/
    - assets/cases/s08/photos/
    - assets/cases/s08/endings/
    - assets/cases/s08/audio/
    - assets/cases/s09/
    - assets/cases/s09/photos/
    - assets/cases/s09/endings/
    - assets/cases/s09/audio/
    - assets/cases/s10/
    - assets/cases/s10/photos/
    - assets/cases/s10/endings/
    - assets/cases/s10/audio/

    # Cast files, shared across the apps that render people.
    - assets/people/

    # Localization. English is the source of truth and the per-key fallback;
    # every other pack overlays it.
    - assets/l10n/en/
    - assets/l10n/tr/
    - assets/l10n/es/
    - assets/l10n/fr/
    - assets/l10n/it/
    - assets/l10n/br/
    - assets/l10n/ru/
    - assets/l10n/pl/

    # Shared, case-agnostic surfaces.
    - assets/textures/
    - assets/paywall/
    - assets/stock/photos/
    - assets/stock/video/

  fonts:
    # The Pro / hints pill's lettering. A variable font — one file, and the
    # weight is picked with `fontVariations` at the call site rather than by
    # shipping a static cut per weight. OFL, and `OFL.txt` sits beside it.
    - family: Geologica
      fonts:
        - asset: assets/Geologica-font/Geologica.ttf
    - family: Caveat
      fonts:
        - asset: assets/Caveat-font/static/Caveat-Regular.ttf
        - asset: assets/Caveat-font/static/Caveat-Medium.ttf
          weight: 500
        - asset: assets/Caveat-font/static/Caveat-SemiBold.ttf
          weight: 600
        - asset: assets/Caveat-font/static/Caveat-Bold.ttf
          weight: 700
